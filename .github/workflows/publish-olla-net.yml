# Publishes the name-hold package at packages/olla-net.
# Configure Trusted Publisher on npmjs.com for package `olla-net`:
#   Org/user: Catalyst-Forge-LLC
#   Repository: ollanet
#   Workflow filename: publish-olla-net.yml
#   Environment: npm
#   Allowed actions: npm publish
name: Publish olla-net

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: packages/olla-net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Ensure npm CLI supports OIDC trusted publishing
        run: npm install -g npm@latest && npm --version

      - run: npm publish --access public
